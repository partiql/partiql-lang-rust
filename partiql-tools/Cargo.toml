[package]
name = "partiql-tools"
version.workspace = true
edition = "2021"
publish = false
autobins = false
autobenches = false
build = "build.rs"

[lib]
name = "partiql_tools"
path = "src/lib.rs"

[features]
test-support = []

[[bin]]
name = "pqlite"
path = "src/bin/pqlite.rs"
bench = false

[dependencies]
smallvec = "1.13"
rustc-hash = "2.0"
ion-rs = "0.18.1"
rand = "0.8"
partiql-logical = { path = "../partiql-logical" }
partiql-ast = { path = "../partiql-ast" }
partiql-ast-passes = { path = "../partiql-ast-passes" }
partiql-catalog = { path = "../partiql-catalog" }
partiql-common = { path = "../partiql-common" }
partiql-vm = { path = "../partiql-vm" }
partiql-extension-ion = { path = "../extension/partiql-extension-ion" }
partiql-logical-planner = { path = "../partiql-logical-planner" }
partiql-parser = { path = "../partiql-parser" }
partiql-value = { path = "../partiql-value" }
clap = { version = "4.6.1", features = ["derive"] }
# Generates the scripts printed by `pqlite completions <shell>`.
clap_complete = "4.6"
# default-features disabled drops the serde / serde-json / serde-bincode codecs
# we don't use; the LMDB backend and the Str/Bytes codecs are unaffected.
heed = { version = "0.20", default-features = false }
reedline = "0.48.0"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Same case folding as partiql-catalog's name lookup.
unicase = "2.7"

# UNSTABLE, in development: loading table functions from C-ABI shared
# libraries (`pqlite --load`, see PLUGINS.md). Deliberately not a Cargo
# feature, so `--all-features` and dependents cannot turn it on. Enable with
#   RUSTFLAGS="--cfg pqlite_unstable_plugins" cargo build -p partiql-tools
[target.'cfg(pqlite_unstable_plugins)'.dependencies]
libloading = "0.8"
arrow-array = { version = "58", default-features = false, features = ["ffi"] }
arrow-schema = { version = "58", default-features = false }

[dev-dependencies]
rstest = "0.23"
tempfile = "3.0"
# Self-activate `test-support` for integration tests in `tests/` so the gated
# module is reachable without requiring `--features test-support` on the CLI.
partiql-tools = { path = ".", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pqlite_unstable_plugins)"] }
