[package]
name = "partiql-tools"
version = "0.15.0-alpha.1"
edition = "2021"
publish = false
autobins = false
autobenches = false
build = "build.rs"

[lib]
name = "partiql_tools"
path = "src/lib.rs"

[features]
test-support = []

[[bin]]
name = "partiql-legacy"
path = "src/bin/partiql_legacy.rs"
bench = false

[[bin]]
name = "partiql-hybrid"
path = "src/bin/partiql_hybrid.rs"
bench = false

[[bin]]
name = "pqlite"
path = "src/bin/pqlite.rs"
bench = false

[[bin]]
name = "partiql-benchmarks"
path = "src/bin/partiql_benchmarks.rs"
bench = false

[[bin]]
name = "partiql-profile"
path = "src/bin/partiql_profile.rs"
bench = false

[[bin]]
name = "engine_profiler"
path = "src/bin/engine_profiler.rs"
bench = false

[dependencies]
glob = "0.3"
indexmap = "2"
memmap2 = "0.9"
smallvec = "1.13"
wide = "0.7"
rustc-hash = "2.0"
ion-rs = "0.18.1"
bytes = "1.9"
rand = "0.8"
partiql-logical = { path = "../partiql-logical" }
partiql-ast = { path = "../partiql-ast" }
partiql-ast-passes = { path = "../partiql-ast-passes" }
partiql-catalog = { path = "../partiql-catalog" }
partiql-common = { path = "../partiql-common" }
partiql-eval = { path = "../partiql-eval" }
partiql-extension-ion = { path = "../extension/partiql-extension-ion" }
partiql-logical-planner = { path = "../partiql-logical-planner" }
partiql-parser = { path = "../partiql-parser" }
partiql-types = { path = "../partiql-types" }
partiql-value = { path = "../partiql-value" }
clap = { version = "4.6.1", features = ["derive"] }
# default-features disabled drops the serde / serde-json / serde-bincode codecs
# we don't use; the LMDB backend and the Str/Bytes codecs are unaffected.
heed = { version = "0.20", default-features = false }
reedline = "0.48.0"
rust_decimal = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempfile = "3.0"
# Self-activate `test-support` for integration tests in `tests/` so the gated
# module is reachable without requiring `--features test-support` on the CLI.
partiql-tools = { path = ".", features = ["test-support"] }
