[package]
name = "partiql-ir"
description = "PartiQL Intermediate Representation"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "Apache-2.0"
readme = "../README.md"
keywords = ["sql", "parser", "query", "compilers", "interpreters"]
categories = ["database", "compilers", "parser-implementations"]
exclude = [
  "**/.git/**",
  "**/.github/**",
  "**/.travis.yml",
  "**/.appveyor.yml",
]
version.workspace = true
edition.workspace = true

[lib]
bench = false

[dependencies]
partiql-types = { path = "../partiql-types", version = "0.15.*" }
partiql-value = { path = "../partiql-value", version = "0.15.*" }

[dev-dependencies]
insta = "1"
