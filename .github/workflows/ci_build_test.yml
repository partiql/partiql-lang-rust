name: CI Build

# `push` runs only for long-lived branches and tags; feature branches are covered by `pull_request`. This avoids running
# every workflow twice (once per event) for each push to a branch with an open PR.
# macOS and Windows run in `nightly.yml` instead, since CI produces no platform-specific artifacts.
# `push` runs on `main`/release branches are also what produce the conformance report artifact that PRs targeting
# those branches compare against (see `conformance-report`), so they must not be path-filtered.
on:
  push:
    branches:
      - main
      - 'release-*'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'

# Supersede in-progress runs for the same PR. The PR number is only set for `pull_request` events, so pushes to
# long-lived branches each get a unique group and are never cancelled (or replaced while pending).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TEST_RESULT_NAME: cargo_test_results.json
  CONFORMANCE_REPORT_NAME: cts_report.json
  COMPARISON_REPORT_NAME: cts-comparison-report.md
  VM_CARGO_TEST_RESULT_NAME: vm_cargo_test_results.json
  VM_CONFORMANCE_REPORT_NAME: vm_cts_report.json
  VM_COMPARISON_REPORT_NAME: vm-cts-comparison-report.md
  RUST_TEST_TIME_UNIT: 150,5000
  RUST_TEST_TIME_INTEGRATION: 150,5000

permissions:
  contents: read
  pull-requests: write

jobs:
  # Lint + license checks + build + test on Linux, all in one runner. Jobs don't depend on each other, so each change
  # queues for runners only once.
  build:
    name: Lint, Build and Test (Linux)
    runs-on: partiql-lang-rust_ubuntu-24.04_4-core
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      # Run cargo-deny check and report.
      # Fails if any of the following are found used in the crate or its dependencies.
      #  - any banned crates
      #  - disallowed open source licenses
      #  - use of disallowed repository sources
      # Reports, but does not fail on:
      #  - security advisories
      # See: https://embarkstudios.github.io/cargo-deny/index.html
      - name: cargo-deny (bans licenses sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
      - name: cargo-deny (advisories)
        # Prevent sudden announcement of a new advisory from failing ci
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Only long-lived branches write the cache; PRs restore from it. Keeps PR runs from evicting useful entries.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Run Clippy
        run: cargo clippy --all-features --workspace -- -D warnings
      # Must run after a cargo command has executed `partiql-conformance-tests/build.rs`, which generates test modules
      # that rustfmt needs to resolve.
      - name: Rustfmt Check
        run: cargo fmt --verbose --all -- --check
      - name: Cargo Build
        run: cargo build --verbose --workspace
      - name: Cargo Test excluding conformance tests
        run: cargo test --verbose --workspace
      # pqlite's plugin C ABI is unstable and compiled in only with this cfg,
      # which --all-features does not set. The tests build a C plugin with the
      # system compiler and load it into pqlite.
      - name: Test unstable pqlite plugin ABI
        env:
          RUSTFLAGS: --cfg pqlite_unstable_plugins
        run: cargo test --verbose -p partiql-tools
      - name: Clippy unstable pqlite plugin ABI
        env:
          RUSTFLAGS: --cfg pqlite_unstable_plugins
        run: cargo clippy -p partiql-tools --all-targets -- -D warnings

  coverage:
    name: Code Coverage
    runs-on: partiql-lang-rust_ubuntu-24.04_4-core
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          # We need this component to generate source coverage in stable
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # Conformance tests are run with 'conformance_test' feature. Since step runs with 'all-features', the conformance
      # test are also run, which can cause `cargo test` to fail. Add 'continue-on-error' step to prevent GH Actions
      # failure.
      - name: Cargo Test w/ Coverage
        continue-on-error: true
        run: cargo llvm-cov --verbose --workspace --all-features --ignore-run-fail --codecov --output-path codecov.json
      - name: Codecov Upload
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          # `CODECOV_TOKEN` is unavailable to fork PRs; don't fail those on a (tokenless) upload error.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Generates the conformance report for this commit and uploads it as an artifact (consumed by later PRs targeting this
  # branch). On `pull_request`, additionally compares it against the base commit's report and the `partiql-vm` report,
  # and posts the result as a PR comment.
  conformance-report:
    name: Conformance report
    runs-on: partiql-lang-rust_ubuntu-24.04_4-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      # Run the conformance tests (i.e. `cargo test`) and save to a json file. This uses the "format" unstable compile
      # option to save as json. In the future, may want to use the `cargo_metadata` crate (https://crates.io/crates/cargo_metadata)
      # to format and use the output.
      - name: Cargo Test of the conformance tests (can fail) and save to json file
        continue-on-error: true
        run: cargo test --verbose --package partiql-conformance-tests --features "conformance_test, experimental" --release -- -Z unstable-options --format json > ${{ env.CARGO_TEST_RESULT_NAME }}
      # Create a conformance report from the `cargo test` json file
      - run: cargo run --features report_tool --bin generate_cts_report ${{ env.CARGO_TEST_RESULT_NAME }} ${GITHUB_SHA} ${{ env.CONFORMANCE_REPORT_NAME }}
      # Upload conformance report for comparison with future runs
      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.CONFORMANCE_REPORT_NAME }}

      # Everything below is `pull_request` only.

      # (Informational) Run the conformance tests against the `partiql-vm` evaluator. These steps never fail the job;
      # the result is reported in the PR comment alongside the legacy comparison.
      - name: (Informational) Cargo Test of the conformance tests against partiql-vm and save to json file
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: cargo test --verbose --package partiql-conformance-tests --features "conformance_test, eval_vm, experimental" --release -- -Z unstable-options --format json > ${{ env.VM_CARGO_TEST_RESULT_NAME }}
      - name: (Informational) Create partiql-vm conformance report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: cargo run --features report_tool --bin generate_cts_report ${{ env.VM_CARGO_TEST_RESULT_NAME }} partiql-vm ${{ env.VM_CONFORMANCE_REPORT_NAME }}
      # Download conformance report from target branch to create comparison report. If target branch has no conformance
      # report, pull down target branch and rebuild conformance report.
      - name: Download conformance report from target branch
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        id: download-report
        continue-on-error: true
        with:
          workflow: ci_build_test.yml
          commit: ${{ github.event.pull_request.base.sha }}
      # (If download of target branch report fails) Run the conformance tests (i.e. `cargo test`) and save to a JSON file.
      - name: (If download of target branch conformance report fails) Checkout target branch
        uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && steps.download-report.outcome == 'failure'
        with:
          submodules: recursive
          path: ${{ github.event.pull_request.base.sha }}
          ref: ${{ github.event.pull_request.base.sha }}
      - name: (If download of target branch conformance report fails) Run conformance tests for target branch
        if: github.event_name == 'pull_request' && steps.download-report.outcome == 'failure'
        continue-on-error: true
        run: |
          cd ${{ github.event.pull_request.base.sha }}
          cargo test --verbose --package partiql-conformance-tests --features "conformance_test" --release -- -Z unstable-options --format json > ${{ env.CARGO_TEST_RESULT_NAME }}
      - name: (If download of target branch conformance report fails) Generate conformance test report for target branch
        if: github.event_name == 'pull_request' && steps.download-report.outcome == 'failure'
        continue-on-error: true
        run: |
          cd ${{ github.event.pull_request.base.sha }}
          cargo run --features report_tool --bin generate_cts_report ${{ env.CARGO_TEST_RESULT_NAME }} ${{ github.event.pull_request.base.sha }} ${{ env.CONFORMANCE_REPORT_NAME }}
      - name: (If download of target branch conformance report fails) Move conformance test report of target branch to ./artifact directory
        if: github.event_name == 'pull_request' && steps.download-report.outcome == 'failure'
        continue-on-error: true
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          cp -r $GITHUB_WORKSPACE/${{ github.event.pull_request.base.sha }}/$CONFORMANCE_REPORT_NAME $GITHUB_WORKSPACE/artifact/$CONFORMANCE_REPORT_NAME
      # Run conformance report comparison. Generates comparison report
      - name: Create comparison report
        if: github.event_name == 'pull_request'
        run: cargo run --features report_tool --bin generate_comparison_report ./artifact/${{ env.CONFORMANCE_REPORT_NAME }} ${{ env.CONFORMANCE_REPORT_NAME }} ${{ env.COMPARISON_REPORT_NAME }}
      # Print conformance report to GitHub actions workflow summary page
      - name: print markdown in run
        if: github.event_name == 'pull_request'
        run: cat ${{ env.COMPARISON_REPORT_NAME }} >> $GITHUB_STEP_SUMMARY
      # (Informational) Compare this commit's legacy evaluator against `partiql-vm`. The full test lists go to the
      # workflow summary; only the summary table and counts are appended to the PR comment, which keeps it well under
      # GitHub's comment size limit.
      - name: (Informational) Compare legacy and partiql-vm conformance reports
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          if [ ! -f "$VM_CONFORMANCE_REPORT_NAME" ]; then
            echo "No partiql-vm conformance report; skipping."
            exit 0
          fi
          cargo run --features report_tool --bin generate_comparison_report $CONFORMANCE_REPORT_NAME $VM_CONFORMANCE_REPORT_NAME $VM_COMPARISON_REPORT_NAME
          {
            echo ""
            echo "### partiql-vm conformance (informational, non-blocking)"
            echo ""
            echo "Legacy evaluator vs. \`partiql-vm\` on this commit. Full test lists are in the workflow run summary."
            echo ""
            sed -e '/^### Conformance comparison report/d' \
                -e '/:interrobang:/,$d' \
                -e '/previously failing but now pass/,$d' \
                -e 's/Base (/Legacy (/g' \
                "$VM_COMPARISON_REPORT_NAME"
          } > vm-comment-section.md
          cat vm-comment-section.md >> $COMPARISON_REPORT_NAME
          {
            echo ""
            echo "## partiql-vm conformance (informational)"
            sed -e 's/Base (/Legacy (/g' "$VM_COMPARISON_REPORT_NAME"
          } >> $GITHUB_STEP_SUMMARY
      # Find comment w/ conformance comparison if previous comment published
      - name: Find Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v2
        continue-on-error: true
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Conformance
      # Create or update (if previous comment exists) with markdown version of comparison report
      - name: Create or update comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-file: ${{ env.COMPARISON_REPORT_NAME }}
          edit-mode: replace
