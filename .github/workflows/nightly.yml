name: Nightly Cross-Platform Build

# macOS and Windows build + test. Kept out of per-PR CI (`ci_build_test.yml`) to save runners: CI builds no
# platform-specific artifacts, and the macOS runner pool is small and shared enterprise-wide.
on:
  schedule:
    - cron: '0 8 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_TIME_UNIT: 150,5000
  RUST_TEST_TIME_INTEGRATION: 150,5000

permissions:
  contents: read

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    steps:
      - name: Remove MSys64 MingW64 Binaries
        if: runner.os == 'Windows'
        # remove this because there is a bad libclang.dll that confuses bindgen
        run: Remove-Item -LiteralPath "C:\msys64\mingw64\bin" -Force -Recurse
      - name: Install Dependencies
        if: runner.os == 'Windows'
        run: choco install llvm -y
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Cargo Build
        run: cargo build --verbose --workspace
      - name: Cargo Test excluding conformance tests
        run: cargo test --verbose --workspace
