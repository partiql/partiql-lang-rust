name: Benchmark

# Do not run this workflow on pull request since this workflow has permission to modify contents.
on:
  push:
    branches:
      - main

env:
  AUTHOR: "@${{ github.event.commits[0].author.username }}"
  REPO: "@${{ github.repository }}"
  REPO_OWNER: "@${{ github.repository_owner }}"
  ACTOR: "@${{ github.actor }}"

permissions:
  # deployments permission to deploy GitHub pages website
  deployments: write
  # contents permission to update benchmark contents in gh-pages branch
  contents: write

jobs:
  benchmark:
    name: Performance regression check
    runs-on: codebuild-partiql-lang-rust-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Run benchmark with `cargo bench` and stores the output to a file
      - name: Run benchmark
        # `shell: bash` runs the script with `-eo pipefail`, so a failed `cargo bench` fails this step (not only `tee`).
        shell: bash
        env:
          # Each bench target is built with fat LTO and full debug info (see `[profile.bench]`), which takes a lot of
          # memory per rustc. Cargo defaults to one job per vCPU, which ran out of memory on the CodeBuild runner
          # (8 vCPU, 15 GB), so cap it at 4 jobs, as on the previous 4-core runner.
          CARGO_BUILD_JOBS: 4
        run: cargo bench -- --output-format bencher | tee output.txt
      # gh-pages branch is updated and pushed automatically with extracted benchmark data
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # A new series for the CodeBuild runner, so alerts do not compare against results from other hardware.
          name: PartiQL (rust) Benchmark (CodeBuild)
          tool: 'cargo'
          output-file-path: output.txt
          # Access token to deploy GitHub Pages branch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push and deploy GitHub pages branch automatically
          auto-push: true
          comment-always: true
          comment-on-alert: true
          alert-threshold: '150%'
          fail-on-alert: true
          alert-comment-cc-users: "${{ env.AUTHOR }},${{ env.ACTOR }},${{ env.REPO_OWNER }}"